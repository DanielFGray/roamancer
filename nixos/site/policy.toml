# The site policy: which apps the runner watches, and whether a push to `main` releases them.
# It sits beside site.toml in the site folder and is read when Nix builds the control host
# (nixos/modules/alchemy-runner.nix), so a change needs `ops rebuild`, which asks for the
# operator's password. An app repository never holds it: a push could change it, and agents
# can push to app repositories but must not widen what releases unattended.
#
# These are placeholder values. The app is inert because its deploy is "manual".
#
# [apps.<cartridge name>]
#   The rebuild makes the app's bare repository on the control host, /srv/git/<name>.git.
#   Push to it over ssh: `git remote add cynic cynic:/srv/git/<name>.git`, then
#   `git push cynic main`.
# deploy:  "auto" releases each new, signed-off tree on `main` within a minute of the push.
#          "manual" never releases from a push; `ops release` still works. Default "auto".
[apps.example-app]
deploy = "manual"
