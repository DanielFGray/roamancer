# The facts that belong to one installation, not to the platform. The flakes read this file
# at build time and pass it to every module as `site`; no host reads it while running. Nothing
# here may be secret: the Nix store is readable by every user on a host.
# These are placeholder values. Keep your own copy of this folder in a private repository
# and set OPS_SITE to it: `ops rebuild` and `install-host.sh` build from a copy of nixos/
# whose `site` folder is replaced by yours.

# Facts the cluster modules share. One machine is the only Nomad server; the others join as
# Nomad clients over the LAN, with no tunnel.
[cluster]
# The Nomad server's host name: its nixosConfigurations name and the name `ops` passes to
# ssh, so ~/.ssh/config supplies the address and user. It also runs OpenBao and the Alchemy
# state, which makes it the control host.
server = "cynic"
lanInterface = "ens18"
# From the router's DHCP, which keeps it stable. If the lease ever changes, the server
# certificate, Raft's peer address and every client's `servers` entry break together.
lanAddress = "192.168.50.10"
lanPrefixLength = 24
# The router: every machine's default route and DNS server.
lanGateway = "192.168.50.1"
# The operator's workstation address (a VPN address, for example). It may reach only the
# listeners behind the cluster CA: images are pushed from it, and test VMs on it join
# from it.
workstation = "10.8.0.2"
# Every machine reaches the image registry on the server by this name, which each one maps
# to lanAddress in /etc/hosts, so a new lease changes no image reference.
registryName = "registry.cluster"
registryPort = 5000
# The cluster CA and leaf certificates. Root-only; never in the Nix store.
tlsDir = "/var/lib/cluster-tls"
# The server's own client certificate for pulling from the registry, readable by the nomad
# user, whose rootless Podman pulls every job's image.
registryClientDir = "/var/lib/registry-client"

# Machines that run Nomad clients, by Nomad node name. The firewall lets them reach every
# TCP port on the server, so their jobs reach services such as Postgres's fixed 5432 and
# Nomad's dynamic ports. The clients let the server reach every TCP port in turn, for
# services Nomad places there. Every listener on the LAN has its own authentication; the
# address list only narrows who can try, on a network where addresses can be forged.
[cluster.nodes]
atheist = "192.168.50.11"

# The human account on every host: the only wheel user, the holder of the SSH keys that can
# log in, and the owner of /etc/nixos so `ops rebuild` can copy the configuration there. It
# is also the account that runs Alchemy on the control host.
[operator]
name = "operator"
sshKeys = [
  "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlaceholderPlaceholderPlaceholderPlaceholder operator@example.com",
]

# Addressing and hardware of the machine that runs the public ingress. Its two network cards
# are matched by MAC address, so they can never swap.
[hosts.atheist]
sshPort = 22
lanMac = "02:00:00:00:00:01"
publicMac = "02:00:00:00:00:02"
# The public IP that DNS names point at, and the provider's gateway for it. The gateway is
# outside the /32, so the route to it is on-link.
publicAddress = "203.0.113.10"
publicGateway = "203.0.113.1"
