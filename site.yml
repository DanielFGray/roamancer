---
- name: Base setup for all VMs
  hosts: all:!nixos
  become: true
  tags: [common, podman]
  roles:
    - common
    - podman

- name: Firewall on obs node
  hosts: obs:!nixos
  become: true
  tags: [firewall]
  roles:
    - role: firewall
      vars:
        web_dlab_ip: "{{ hostvars[groups['web'][0]].dlab_ip }}"
        firewall_allow:
          - { port: "80", comment: HTTP }
          - { port: "443", comment: HTTPS }
          - { port: "8200", comment: "OpenBao (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8300", comment: "Consul server RPC (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8301", proto: tcp, comment: "Consul LAN gossip (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8301", proto: udp, comment: "Consul LAN gossip (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8500", comment: "Consul HTTP API (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8600", proto: tcp, comment: "Consul DNS (web)", src: "{{ web_dlab_ip }}" }
          - { port: "8600", proto: udp, comment: "Consul DNS (web)", src: "{{ web_dlab_ip }}" }

- name: Firewall on web node
  hosts: web:!nixos
  become: true
  tags: [firewall]
  roles:
    - role: firewall
      vars:
        obs_dlab_ip: "{{ hostvars[groups['obs'][0]].dlab_ip }}"
        # cynic has no public IP; only atheist's reverse proxy may reach it,
        # over the WireGuard mesh -- never the open internet.
        firewall_allow:
          - { port: "80", comment: "Caddy (from atheist proxy only)", src: "{{ obs_dlab_ip }}" }
          - { port: "8301", proto: tcp, comment: "Consul LAN gossip (obs)", src: "{{ obs_dlab_ip }}" }
          - { port: "8301", proto: udp, comment: "Consul LAN gossip (obs)", src: "{{ obs_dlab_ip }}" }
          - { port: "8500", comment: "Consul HTTP API (obs)", src: "{{ obs_dlab_ip }}" }
          - { port: "8600", proto: tcp, comment: "Consul DNS (obs)", src: "{{ obs_dlab_ip }}" }
          - { port: "8600", proto: udp, comment: "Consul DNS (obs)", src: "{{ obs_dlab_ip }}" }

- name: OpenBao on obs node
  hosts: obs:!nixos
  become: true
  tags: [vault]
  roles:
    - vault

- name: Install OpenBao CA trust on all hosts
  hosts: all:!nixos
  become: true
  tags: [vault, trust]
  tasks:
    - name: Install and verify OpenBao CA trust
      when: not (vault_tls_disable | default(false) | bool)
      block:
        - name: Check configured OpenBao CA source on obs node
          stat:
            path: "{{ hostvars[groups['obs'][0]].vault_tls_ca_file }}"
          delegate_to: "{{ groups['obs'][0] }}"
          register: openbao_ca_source

        - name: Require configured OpenBao CA source
          assert:
            that:
              - openbao_ca_source.stat.exists
            fail_msg: >-
              OpenBao TLS is enabled but its configured CA source is missing on
              {{ groups['obs'][0] }}: {{ hostvars[groups['obs'][0]].vault_tls_ca_file }}

        - name: Install CA certificate package
          apt:
            name: ca-certificates
            state: present

        - name: Read configured OpenBao CA from obs node
          slurp:
            src: "{{ hostvars[groups['obs'][0]].vault_tls_ca_file }}"
          delegate_to: "{{ groups['obs'][0] }}"
          register: openbao_ca_content

        - name: Validate OpenBao CA source is PEM certificate material
          assert:
            that:
              - openbao_ca_content.content | b64decode is search('-----BEGIN CERTIFICATE-----')
            fail_msg: >-
              OpenBao CA source exists but does not contain PEM certificate material:
              {{ hostvars[groups['obs'][0]].vault_tls_ca_file }}

        - name: Install OpenBao CA certificate
          copy:
            content: "{{ openbao_ca_content.content | b64decode }}"
            dest: /usr/local/share/ca-certificates/openbao.crt
            owner: root
            group: root
            mode: "0644"
          register: openbao_ca_installed

        - name: Refresh system CA trust
          command: update-ca-certificates
          when: openbao_ca_installed.changed

- name: Consul agents on all nodes
  hosts: all:!nixos
  become: true
  tags: [consul]
  roles:
    - consul

- name: Caddy reverse proxy on obs node
  hosts: obs:!nixos
  become: true
  tags: [caddy, caddy-proxy]
  roles:
    - role: caddy
      vars:
        caddy_template: Caddyfile-proxy.j2
        caddy_plugins:
          - github.com/caddy-dns/cloudflare
        caddy_env: "{{ {'CF_API_TOKEN': cloudflare_api_token} if caddy_tls_enabled | default(true) else {} }}"
        caddy_managed_domains:
          - dfg.rocks
          - danielfgray.com
          - postgres.garden

- name: Caddy on web node
  hosts: web:!nixos
  become: true
  tags: [caddy, caddy-web]
  roles:
    - caddy

- name: Compose services on web node
  hosts: web:!nixos
  become: true
  tags: [compose, compose-web]
  roles:
    - role: compose
      vars:
        compose_stacks:
          - name: postgres
            src: services/postgres/compose.yml
            dest: /opt/services/postgres/compose.yml
            env_template: ../../roles/compose/templates/infra-env.j2
            migrate_from_volume: postgres-data
            migrate_from_dir: /opt/services/infra
            data_path: /srv/data/postgres
            data_owner: "70"
            data_group: "70"
            data_mode: "0750"
          - name: valkey
            src: services/valkey/compose.yml
            dest: /opt/services/valkey/compose.yml
            migrate_from_volume: valkey-data
            migrate_from_dir: /opt/services/infra
            data_path: /srv/data/valkey
            data_owner: "999"
            data_group: "1000"
            data_mode: "0750"

- name: SigNoz on obs node
  hosts: obs:!nixos
  become: true
  tags: [compose, compose-obs]
  roles:
    - role: compose
      vars:
        compose_stacks:
          - name: zookeeper
            src: services/zookeeper/compose.yml
            dest: /opt/services/zookeeper/compose.yml
            migrate_from_volume: zookeeper-data
            migrate_from_dir: /opt/services/signoz
            data_path: /srv/data/zookeeper
            data_owner: "1001"
            data_group: "0"
            data_mode: "0775"
          - name: clickhouse
            src: services/clickhouse/compose.yml
            dest: /opt/services/clickhouse/compose.yml
            migrate_from_volume: clickhouse-data
            migrate_from_dir: /opt/services/signoz
            data_path: /srv/data/clickhouse
            data_owner: "101"
            data_group: "101"
            data_mode: "0750"
            # Other split services (signoz, otel-collector) reach clickhouse
            # by this fixed address via extra_hosts rather than by name --
            # see roles/compose's "Pin clickhouse's address" task.
            network_ip: 10.89.3.10
            # ClickHouse's entrypoint also chowns this second bind mount
            # (its own BACKUP TABLE destination) at container startup --
            # needs the same rootless-namespace ownership remap as data_path.
            extra_data_paths:
              - path: /opt/backups/clickhouse
                owner: "101"
                group: "101"
          - name: signoz
            src: services/signoz/compose.yml
            dest: /opt/services/signoz/compose.yml
            migrate_from_volume: signoz-data
            migrate_from_dir: /opt/services/signoz
            data_path: /srv/data/signoz
            data_owner: "0"
            data_group: "0"
            data_mode: "0750"
        compose_extra_files:
          - src: services/clickhouse/backups.xml
            dest: /opt/services/clickhouse/backups.xml
          - src: services/signoz/otel-collector-config.yaml
            dest: /opt/services/signoz/otel-collector-config.yaml

- name: Infra agent on web node
  hosts: web:!nixos
  become: true
  tags: [infra-agent]
  vars:
    # roles/vault mints or renews these narrow, renewable tokens on every
    # apply (see roles/vault/tasks/main.yml) -- the agent never sees
    # OpenBao's root token.
    infra_openbao_secrets_token: "{{ hostvars[groups['obs'][0]].vault_agent_secrets_token | default('') }}"
    infra_openbao_backups_token: "{{ hostvars[groups['obs'][0]].vault_agent_backups_token | default('') }}"
  roles:
    - infra-agent
