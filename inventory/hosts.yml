all:
  children:
    # web01: public-facing — Caddy, Vault, Nomad server, Consul server,
    #        PostgreSQL, Valkey, postgres.garden, static sites
    web:
      hosts:
        web01:
          ansible_host: 10.0.0.10  # adjust to your Proxmox network
          nomad_node_class: web
          nomad_server: true
          consul_server: true
          caddy_enabled: true

    # obs01: observability — SignOz, ClickHouse, OTEL collector
    obs:
      hosts:
        obs01:
          ansible_host: 10.0.0.11  # adjust to your Proxmox network
          nomad_node_class: obs
          nomad_server: false
          consul_server: false

  vars:
    ansible_user: dan
    ansible_python_interpreter: /usr/bin/python3

    # Networking
    consul_server_addr: "{{ hostvars['web01']['ansible_host'] }}"
    obs_addr: "{{ hostvars['obs01']['ansible_host'] }}"

    # Nomad
    nomad_version: "1.9.7"
    nomad_datacenter: home
    nomad_region: global

    # Vault
    vault_version: "1.19.0"
    vault_addr: "http://{{ consul_server_addr }}:8200"

    # Consul
    consul_version: "1.20.0"
