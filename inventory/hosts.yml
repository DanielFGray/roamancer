all:
  children:
    # Keep peer address metadata available to obs, but exclude NixOS hosts
    # from every play in site.yml. Nix owns their host configuration.
    nixos:
      hosts:
        web01:
    web:
      hosts:
        web01:
          ansible_host: cynic.dlab
          ansible_port: 2022
          caddy_enabled: true
          dlab_fqdn: cynic.dlab
          dlab_ip: 10.13.37.196

    obs:
      hosts:
        obs01:
          ansible_host: atheist.dlab
          ansible_port: 10022
          dlab_fqdn: atheist.dlab
          dlab_ip: 10.13.37.83

  vars:
    ansible_user: dan
    ansible_python_interpreter: /usr/bin/python3
    obs_addr: "{{ hostvars['obs01']['ansible_host'] }}"
    web_addr: "{{ hostvars['web01']['ansible_host'] }}"
    vault_tls_disable: false
    vault_tls_cert_file: /etc/openbao/tls/openbao.crt
    vault_tls_key_file: /etc/openbao/tls/openbao.key
    vault_tls_ca_file: /etc/openbao/tls/ca.crt
    vault_addr: "{{ 'http' if (vault_tls_disable | bool) else 'https' }}://{{ obs_addr }}:8200"
    vault_version: "2.5.1"
    vault_checksum: "a7cc2207e6e0a262127e4a0b00f3553526778266be80796c811f4a57677089a2"
    infra_api_port: 9000
