---
- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - gnupg
    state: present

- name: Add Docker GPG key
  apt_key:
    url: https://download.docker.com/linux/debian/gpg
    state: present

- name: Add Docker repo
  apt_repository:
    repo: "deb https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present

- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

- name: Add user to docker group
  user:
    name: dan
    groups: docker
    append: true

- name: Start Docker
  systemd:
    name: docker
    state: started
    enabled: true
