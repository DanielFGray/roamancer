---
- name: Stop Docker service
  systemd:
    name: docker
    state: stopped
    enabled: false
  ignore_errors: true

- name: Stop Docker socket
  systemd:
    name: docker.socket
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
    state: absent
    purge: true
  ignore_errors: true

- name: Remove Docker apt repository
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.asc
    - /etc/apt/keyrings/docker.gpg

- name: Update apt cache after repo removal
  apt:
    update_cache: true

- name: Install Podman
  apt:
    name:
      - podman
      - podman-compose
    state: present
