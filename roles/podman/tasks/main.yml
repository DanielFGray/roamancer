---
- name: Stop Docker service
  systemd:
    name: docker
    state: stopped
    enabled: false
  ignore_errors: true

- name: Stop Docker socket
  systemd:
    name: docker.socket
    state: stopped
    enabled: false
  ignore_errors: true

- name: Remove Docker packages
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-ce-rootless-extras
    state: absent
    purge: true
  ignore_errors: true

- name: Remove Docker apt repository files
  shell: rm -f /etc/apt/sources.list.d/docker.* /etc/apt/keyrings/docker.*
  register: docker_repo_removed
  changed_when: docker_repo_removed.rc == 0

- name: Update apt cache after repo removal
  apt:
    update_cache: true
  register: apt_update
  retries: 3
  delay: 5
  until: apt_update is success

- name: Install Podman
  apt:
    name:
      - podman
      - podman-compose
    state: present

- name: Configure default registries for short image names
  copy:
    dest: /etc/containers/registries.conf.d/shortnames.conf
    content: |
      unqualified-search-registries = ["docker.io"]
    mode: "0644"

# Containers run under prod's own rootless podman, not root's -- so every
# podman/podman-compose invocation below needs prod's user session
# (XDG_RUNTIME_DIR, DBUS_SESSION_BUS_ADDRESS) rather than the play's
# become:true. prod already has a subuid/subgid range and lingering enabled
# (roles/common), so its user@<uid>.service just needs to actually be up.
- name: Get prod user UID
  command: id -u prod
  register: prod_uid
  changed_when: false

- name: Ensure prod user systemd session is running
  systemd:
    name: "user@{{ prod_uid.stdout }}.service"
    state: started

# Split services each get their own podman-compose project (own network)
# so they can be moved independently -- but that means bare hostnames like
# "clickhouse" no longer resolve across projects the way they did in the
# old bundled stack. This shared network lets any compose.yml reach its
# peers regardless of which project started them.
#
# Cross-service references use static IPs on this network (each
# compose.yml pins its service's address, dependents get an `extra_hosts`
# entry) rather than aardvark-dns: Debian bookworm ships aardvark-dns
# 1.4.0, which fails to answer container-to-container queries reliably
# (confirmed against both musl and glibc containers on testground -- the
# query to aardvark-dns fails and silently falls through to the host's
# real upstream resolver, which has never heard of "clickhouse"). trixie
# ships a working 1.14.0, but there's no backport, and upgrading the
# host OS is out of scope here. The subnet is pinned explicitly so a
# service's static IP is stable across recreates and hosts alike -- it
# was already auto-assigned this /24 on every existing host, so pinning
# it here is a no-op, not a change.
- name: Create shared podman network for cross-service addressing
  command: podman network create infra --subnet 10.89.3.0/24
  become_user: prod
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ prod_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ prod_uid.stdout }}/bus"
  register: infra_network
  changed_when: infra_network.rc == 0
  failed_when: infra_network.rc != 0 and 'already exists' not in infra_network.stderr
