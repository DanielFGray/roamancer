---
- name: Download Nomad
  get_url:
    url: "https://releases.hashicorp.com/nomad/{{ nomad_version }}/nomad_{{ nomad_version }}_linux_amd64.zip"
    dest: /tmp/nomad.zip

- name: Install Nomad
  unarchive:
    src: /tmp/nomad.zip
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"

- name: Create Nomad directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/nomad.d
    - /opt/nomad/data

- name: Write Nomad config
  template:
    src: nomad.hcl.j2
    dest: /etc/nomad.d/nomad.hcl
    mode: "0644"
  notify: restart nomad

- name: Write Nomad systemd unit
  template:
    src: nomad.service.j2
    dest: /etc/systemd/system/nomad.service
    mode: "0644"
  notify: restart nomad

- name: Start Nomad
  systemd:
    name: nomad
    state: started
    enabled: true
    daemon_reload: true
