---
- name: Install Consul dependencies
  apt:
    name:
      - netcat-openbsd
    state: present

- name: Create HashiCorp apt keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download HashiCorp apt GPG key
  get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"

- name: Add HashiCorp apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    state: present

- name: Install Consul
  apt:
    name: "consul={{ consul_version }}-1"
    state: present
    update_cache: true

- name: Create Consul system user
  user:
    name: consul
    system: true
    shell: /usr/sbin/nologin
    home: /opt/consul
    create_home: false

- name: Create Consul directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: consul
    group: consul
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/consul.d, mode: "0755" }
    - { path: /etc/consul.d/services, mode: "0755" }
    - { path: /opt/consul, mode: "0755" }
    - { path: /opt/consul/data, mode: "0750" }

- name: Deploy Consul agent config
  template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: "0640"
  notify: restart consul

- name: Deploy Consul systemd unit
  template:
    src: consul.service.j2
    dest: /etc/systemd/system/consul.service
    owner: root
    group: root
    mode: "0644"
  notify: restart consul

- name: Configure systemd-resolved for Consul DNS
  file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write systemd-resolved Consul DNS drop-in
  copy:
    dest: /etc/systemd/resolved.conf.d/consul.conf
    content: |
      [Resolve]
      DNS=127.0.0.1:8600
      Domains=~consul
    owner: root
    group: root
    mode: "0644"
  notify: restart systemd-resolved

- name: Enable and start Consul
  systemd:
    name: consul
    state: started
    enabled: true
    daemon_reload: true
