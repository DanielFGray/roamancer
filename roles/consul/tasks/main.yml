---
- name: Download Consul
  get_url:
    url: "https://releases.hashicorp.com/consul/{{ consul_version }}/consul_{{ consul_version }}_linux_amd64.zip"
    dest: /tmp/consul.zip

- name: Install Consul
  unarchive:
    src: /tmp/consul.zip
    dest: /usr/local/bin/
    remote_src: true
    mode: "0755"

- name: Create Consul directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/consul.d
    - /opt/consul/data

- name: Write Consul config
  template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    mode: "0644"
  notify: restart consul

- name: Write Consul systemd unit
  template:
    src: consul.service.j2
    dest: /etc/systemd/system/consul.service
    mode: "0644"
  notify: restart consul

- name: Start Consul
  systemd:
    name: consul
    state: started
    enabled: true
    daemon_reload: true
