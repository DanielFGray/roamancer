---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - acl
      - curl
      - unzip
      - rsync
      - git
      - jq
      - htop
    state: present

- name: Create web group
  group:
    name: web
    state: present

- name: Ensure dan user exists with sudo
  user:
    name: dan
    groups: sudo,web
    append: true
    shell: /bin/bash

- name: Ensure prod user exists without sudo
  user:
    name: prod
    groups: web
    append: true
    shell: /bin/bash

- name: Install bun for prod user
  shell: curl -fsSL https://bun.sh/install | bash
  args:
    creates: /home/prod/.bun/bin/bun
  become_user: prod

- name: Create service directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prod
    group: web
    mode: "0775"
  loop:
    - /srv/projects
    - /opt/services

- name: Create webroot base directory (web node)
  file:
    path: /srv/www
    state: directory
    owner: prod
    group: web
    mode: "0775"
  when: inventory_hostname in groups['web']

- name: Create backup directories (web node)
  file:
    path: /opt/backups/postgres
    state: directory
    owner: prod
    group: web
    mode: "0775"
  when: inventory_hostname in groups['web']

- name: Create backup directories (obs node)
  file:
    path: /opt/backups/vault
    state: directory
    owner: prod
    group: web
    mode: "0775"
  when: inventory_hostname in groups['obs']
