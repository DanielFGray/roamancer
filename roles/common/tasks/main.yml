---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - unzip
      - rsync
      - git
      - jq
      - htop
    state: present

- name: Install bun
  shell: curl -fsSL https://bun.sh/install | bash
  args:
    creates: /home/dan/.bun/bin/bun
  become_user: dan

- name: Create shared directories
  file:
    path: "{{ item }}"
    state: directory
    owner: dan
    group: dan
    mode: "0755"
  loop:
    - /opt/nomad/jobs
    - /opt/nomad/scripts

- name: Create volume directories (web node)
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/nomad/volumes/postgres
    - /opt/nomad/volumes/valkey
    - /opt/nomad/volumes/registry
  when: nomad_node_class == "web"

- name: Create volume directories (obs node)
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/nomad/volumes/clickhouse
    - /opt/nomad/volumes/signoz
    - /opt/nomad/volumes/zookeeper
  when: nomad_node_class == "obs"

- name: Create webroot directories (web node)
  file:
    path: "/srv/www/{{ item }}"
    state: directory
    owner: dan
    group: dan
    mode: "0755"
  loop:
    - danielfgray.com
    - dfg.rocks
    - dfg.codes
    - eddie.dfg.rocks
    - pg-sourcerer.dfg.codes
  when: nomad_node_class == "web"
