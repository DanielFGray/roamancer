---
- name: Check OpenBao TLS certificate file
  stat:
    path: "{{ vault_tls_cert_file | default('/etc/openbao/tls/openbao.crt') }}"
  register: vault_tls_cert
  when: not (vault_tls_disable | default(false) | bool)

- name: Check OpenBao TLS key file
  stat:
    path: "{{ vault_tls_key_file | default('/etc/openbao/tls/openbao.key') }}"
  register: vault_tls_key
  when: not (vault_tls_disable | default(false) | bool)

- name: Check OpenBao TLS CA file
  stat:
    path: "{{ vault_tls_ca_file | default('/etc/openbao/tls/ca.crt') }}"
  register: vault_tls_ca
  when: not (vault_tls_disable | default(false) | bool)

- name: Assert OpenBao TLS files exist
  assert:
    that:
      - vault_tls_cert.stat.exists
      - vault_tls_key.stat.exists
      - vault_tls_ca.stat.exists
    fail_msg: >-
      OpenBao TLS is enabled but one or more TLS files are missing.
      Set vault_tls_cert_file, vault_tls_key_file, and vault_tls_ca_file or explicitly set vault_tls_disable=true.
  when: not (vault_tls_disable | default(false) | bool)

- name: Download OpenBao .deb package
  get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ vault_version }}/openbao_{{ vault_version }}_linux_amd64.deb"
    dest: /tmp/openbao.deb
    mode: "0644"
    checksum: "sha256:{{ vault_checksum }}"

- name: Install OpenBao
  apt:
    deb: /tmp/openbao.deb

- name: Create OpenBao data directory
  file:
    path: /opt/openbao/data
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"

- name: Write OpenBao config
  template:
    src: vault.hcl.j2
    dest: /etc/openbao/openbao.hcl
    owner: openbao
    group: openbao
    mode: "0640"
  notify: restart openbao

- name: Start OpenBao
  systemd:
    name: openbao
    state: started
    enabled: true
    daemon_reload: true

# Restarting OpenBao reseals it -- unsealing is in-memory state, not
# persisted. A config change earlier in this play left "restart openbao"
# queued; if it fired after the bootstrap block below via the normal
# end-of-play handler flush, it would reseal the vault right after
# initializing it. Flush it here, before anything cares whether the vault
# is sealed.
- meta: flush_handlers

- name: Wait for OpenBao API to answer
  uri:
    url: "{{ vault_local_url }}/v1/sys/seal-status"
    validate_certs: false
    status_code: 200
  register: vault_seal_status
  retries: 10
  delay: 2
  until: vault_seal_status.status == 200

# A fresh OpenBao is useless until it's initialized (generates its root
# token and unseal key), unsealed, and has the KV engines this cluster's
# roles write to actually mounted -- `bao operator init` alone stops short
# of that. This block does the whole thing in one shot, the same sequence
# tools/infra's own `vault init` subcommand runs by hand.
#
# Recovery material is persisted to the control machine immediately after
# init, before any of the calls below that mutate this OpenBao instance
# (unseal, mount, policy write). A crash partway through those would leave
# an initialized-but-not-yet-configured OpenBao; as long as the recovery
# file made it to disk first, that's recoverable. Persisting it after would
# mean a crash could leave an initialized OpenBao with no way to unseal it.
- name: Bootstrap OpenBao (first run only)
  when: not vault_seal_status.json.initialized
  block:
    - name: Initialize OpenBao
      uri:
        url: "{{ vault_local_url }}/v1/sys/init"
        method: PUT
        validate_certs: false
        body_format: json
        body:
          secret_shares: 1
          secret_threshold: 1
        status_code: 200
      register: vault_init_result
      no_log: true

    - name: Ensure local OpenBao recovery directory exists
      file:
        path: "{{ vault_recovery_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Check for existing recovery material for this cluster
      stat:
        path: "{{ vault_recovery_dir }}/{{ inventory_hostname }}.json"
      register: vault_existing_recovery_file
      delegate_to: localhost
      become: false

    # OpenBao just reported itself uninitialized, so this file (if present)
    # can't belong to the cluster we're about to create -- it's either a
    # stale leftover from a wiped OpenBao or a second cluster's material
    # bootstrapped from this same control machine under the same
    # inventory_hostname. Overwriting it would silently strand whichever
    # cluster it actually belongs to.
    - name: Refuse to overwrite existing recovery material
      assert:
        that: not vault_existing_recovery_file.stat.exists
        fail_msg: >-
          {{ vault_recovery_dir }}/{{ inventory_hostname }}.json already
          exists, but OpenBao just reported itself as uninitialized. Move
          the existing file aside first if a genuine re-init is what you
          want -- overwriting it here would strand whatever it belongs to.

    - name: Save unseal key and root token locally
      copy:
        content: "{{ {'unseal_key': vault_init_result.json.keys_base64[0], 'root_token': vault_init_result.json.root_token} | to_nice_json }}\n"
        dest: "{{ vault_recovery_dir }}/{{ inventory_hostname }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    # The file above is the only copy of what unseals this cluster; losing
    # it (disk failure, a wiped control machine) strands OpenBao for good --
    # there's no cloud auto-unseal or Shamir quorum here. Mirroring it into
    # the operator's own `pass` store piggybacks on whatever durability that
    # store already has (its own git remote, if any) rather than building
    # new backup machinery for one file. Best-effort: pass may not be
    # installed or configured, and that's never a reason to fail a
    # bootstrap that already wrote the primary copy.
    - name: Check whether pass (password-store) is available
      command: which pass
      register: vault_pass_available
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false

    - name: Mirror recovery material into pass
      command: "pass insert -m -f infra/openbao/{{ inventory_hostname }}"
      args:
        stdin: "{{ {'unseal_key': vault_init_result.json.keys_base64[0], 'root_token': vault_init_result.json.root_token} | to_nice_json }}"
      register: vault_pass_mirror
      delegate_to: localhost
      become: false
      no_log: true
      failed_when: false
      when: vault_pass_available.rc == 0

    - name: Warn if recovery material could not be mirrored into pass
      debug:
        msg: >-
          Could not mirror OpenBao recovery material into `pass`
          ({{ 'pass not found on PATH' if vault_pass_available.rc != 0
              else 'pass insert exited ' + (vault_pass_mirror.rc | default('?') | string) }}).
          {{ vault_recovery_dir }}/{{ inventory_hostname }}.json is now the
          only copy -- back it up manually.
      when: vault_pass_available.rc != 0 or vault_pass_mirror.rc | default(1) != 0

    - name: Unseal OpenBao
      uri:
        url: "{{ vault_local_url }}/v1/sys/unseal"
        method: PUT
        validate_certs: false
        body_format: json
        body:
          key: "{{ vault_init_result.json.keys_base64[0] }}"
        status_code: 200
      no_log: true

    - name: Enable KV-v2 secrets engines
      uri:
        url: "{{ vault_local_url }}/v1/sys/mounts/{{ item }}"
        method: POST
        validate_certs: false
        headers:
          X-Vault-Token: "{{ vault_init_result.json.root_token }}"
        body_format: json
        body:
          type: kv-v2
        status_code: 204
      loop:
        - secret
        - meta
      no_log: true

    # Downstream tasks in this same run (the always-run token block below,
    # infra-agent) need this token too -- a reboot never hits this block
    # again, since init only happens once, so there's no ongoing
    # auto-unseal behavior hiding in here.
    - name: Make root token available to later tasks in this run
      set_fact:
        vault_bootstrap_root_token: "{{ vault_init_result.json.root_token }}"
      no_log: true

    - name: Report bootstrap result
      debug:
        msg: >-
          OpenBao initialized and unsealed. Unseal key and root token saved to
          {{ vault_recovery_dir }}/{{ inventory_hostname }}.json on the control
          machine -- back that file up somewhere durable now. A future reboot of
          this node leaves OpenBao sealed; that file is what you'll unseal it with.

- name: Fail loudly if OpenBao is initialized but sealed
  fail:
    msg: >-
      OpenBao is initialized but sealed, and auto-unseal is intentionally not
      automated. Unseal it with the key from {{ vault_recovery_dir }}/{{ inventory_hostname }}.json
      (wherever it was bootstrapped from), e.g.:
      ansible -i <inventory> {{ inventory_hostname }} -m shell -a
      "BAO_ADDR={{ vault_local_url }} bao operator unseal <unseal_key>"
  when:
    - vault_seal_status.json.initialized
    - vault_seal_status.json.sealed

# Everything from here down runs on every apply, not just first bootstrap --
# this is what keeps the agent's tokens alive (and recoverable) across
# applies that don't hit the once-only block above.

- name: Determine OpenBao root token for this run (freshly bootstrapped)
  set_fact:
    vault_root_token: "{{ vault_bootstrap_root_token }}"
  no_log: true
  when: vault_bootstrap_root_token is defined

- name: Read persisted OpenBao recovery material
  slurp:
    path: "{{ vault_recovery_dir }}/{{ inventory_hostname }}.json"
  register: vault_recovery_slurp
  delegate_to: localhost
  become: false
  no_log: true
  when: vault_bootstrap_root_token is not defined

- name: Determine OpenBao root token for this run (from recovery material)
  set_fact:
    vault_root_token: "{{ (vault_recovery_slurp.content | b64decode | from_json).root_token }}"
  no_log: true
  when: vault_bootstrap_root_token is not defined

- name: Write OpenBao agent policies
  uri:
    url: "{{ vault_local_url }}/v1/sys/policies/acl/{{ item.name }}"
    method: PUT
    validate_certs: false
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    body_format: json
    body:
      policy: "{{ lookup('file', item.file) }}"
    status_code: 204
  loop:
    - { name: infra-agent-secrets, file: secrets-policy.hcl }
    - { name: infra-agent-backups, file: backups-policy.hcl }
  no_log: true

- name: Issue or renew the infra-agent secrets token
  include_tasks: issue-agent-token.yml
  vars:
    token_name: agent-secrets
    policy_name: infra-agent-secrets

- name: Issue or renew the infra-agent backups token
  include_tasks: issue-agent-token.yml
  vars:
    token_name: agent-backups
    policy_name: infra-agent-backups

- name: Make agent tokens available to later plays in this run
  set_fact:
    vault_agent_secrets_token: "{{ vault_issued_tokens['agent-secrets'] }}"
    vault_agent_backups_token: "{{ vault_issued_tokens['agent-backups'] }}"
  no_log: true
