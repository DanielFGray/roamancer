---
- name: Check OpenBao TLS certificate file
  stat:
    path: "{{ vault_tls_cert_file | default('/etc/openbao/tls/openbao.crt') }}"
  register: vault_tls_cert
  when: not (vault_tls_disable | default(false) | bool)

- name: Check OpenBao TLS key file
  stat:
    path: "{{ vault_tls_key_file | default('/etc/openbao/tls/openbao.key') }}"
  register: vault_tls_key
  when: not (vault_tls_disable | default(false) | bool)

- name: Check OpenBao TLS CA file
  stat:
    path: "{{ vault_tls_ca_file | default('/etc/openbao/tls/ca.crt') }}"
  register: vault_tls_ca
  when: not (vault_tls_disable | default(false) | bool)

- name: Assert OpenBao TLS files exist
  assert:
    that:
      - vault_tls_cert.stat.exists
      - vault_tls_key.stat.exists
      - vault_tls_ca.stat.exists
    fail_msg: >-
      OpenBao TLS is enabled but one or more TLS files are missing.
      Set vault_tls_cert_file, vault_tls_key_file, and vault_tls_ca_file or explicitly set vault_tls_disable=true.
  when: not (vault_tls_disable | default(false) | bool)

- name: Download OpenBao .deb package
  get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ vault_version }}/openbao_{{ vault_version }}_linux_amd64.deb"
    dest: /tmp/openbao.deb
    mode: "0644"
    checksum: "sha256:{{ vault_checksum }}"

- name: Install OpenBao
  apt:
    deb: /tmp/openbao.deb

- name: Create OpenBao data directory
  file:
    path: /opt/openbao/data
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"

- name: Write OpenBao config
  template:
    src: vault.hcl.j2
    dest: /etc/openbao/openbao.hcl
    owner: openbao
    group: openbao
    mode: "0640"
  notify: restart openbao

- name: Start OpenBao
  systemd:
    name: openbao
    state: started
    enabled: true
    daemon_reload: true
