---
- name: Download OpenBao .deb package
  get_url:
    url: "https://github.com/openbao/openbao/releases/download/v{{ vault_version }}/openbao_{{ vault_version }}_linux_amd64.deb"
    dest: /tmp/openbao.deb
    mode: "0644"

- name: Install OpenBao
  apt:
    deb: /tmp/openbao.deb

- name: Create OpenBao data directory
  file:
    path: /opt/openbao/data
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"

- name: Write OpenBao config
  template:
    src: vault.hcl.j2
    dest: /etc/openbao/openbao.hcl
    owner: openbao
    group: openbao
    mode: "0640"
  notify: restart openbao

- name: Start OpenBao
  systemd:
    name: openbao
    state: started
    enabled: true
    daemon_reload: true
