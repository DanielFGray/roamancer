---
- name: Install ufw
  apt:
    name: ufw
    state: present

- name: Define built-in managed firewall rules
  set_fact:
    firewall_base_rules:
      - { rule: allow, port: "{{ ansible_port }}", proto: tcp, comment: SSH }
      - { rule: allow, port: "51820", proto: udp, comment: WireGuard }

- name: Define complete managed firewall rule list
  set_fact:
    firewall_managed_rules: "{{ firewall_base_rules + (firewall_allow | default([])) }}"

- name: Check managed firewall state file
  stat:
    path: "{{ firewall_state_file }}"
  register: firewall_state

- name: Read managed firewall state file
  slurp:
    src: "{{ firewall_state_file }}"
  register: firewall_previous_state
  when: firewall_state.stat.exists

- name: Load previous managed firewall rules
  set_fact:
    firewall_previous_rules: "{{ firewall_previous_state.content | b64decode | from_json }}"
  when: firewall_state.stat.exists

- name: Start with no previous managed firewall rules
  set_fact:
    firewall_previous_rules: []
  when: not firewall_state.stat.exists

- name: Validate managed firewall sources
  command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - "import ipaddress, sys; ipaddress.ip_network(sys.argv[1], strict=False)"
      - "{{ item.src }}"
  changed_when: false
  loop: "{{ firewall_allow | default([]) }}"
  loop_control:
    label: "{{ item.comment | default(item.port) }} source={{ item.src | default('any') }}"
  when: item.src is defined

# Add the current connection rules before removing stale managed rules. This
# avoids a gap in SSH access when ansible_port changes. The first rollout has
# no state file, so existing rules are left alone rather than guessed at.
- name: Add current SSH and WireGuard safety rules
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ firewall_base_rules }}"

- name: Remove stale managed firewall rules
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
    delete: true
  loop: "{{ firewall_previous_rules }}"
  loop_control:
    label: "{{ item.comment | default(item.port) }}"
  when: item not in firewall_managed_rules

- name: Set default deny incoming
  ufw:
    direction: incoming
    policy: deny

- name: Set default allow outgoing
  ufw:
    direction: outgoing
    policy: allow

- name: Allow additional ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_allow | default([]) }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Ensure firewall state directory exists
  file:
    path: "{{ firewall_state_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Atomically save managed firewall rules
  copy:
    content: "{{ firewall_managed_rules | to_nice_json }}\n"
    dest: "{{ firewall_state_file }}"
    owner: root
    group: root
    mode: "0600"
