---
- name: Get prod user UID
  command: id -u prod
  register: prod_uid
  changed_when: false

- name: Require infra API token for agent
  assert:
    that:
      - infra_api_token is defined
      - infra_api_token | trim | length > 0
    fail_msg: infra_api_token must be set for the infra agent; refusing to deploy an unauthenticated control plane.

- name: Require OpenBao token for agent
  assert:
    that:
      - infra_openbao_token is defined
      - infra_openbao_token | trim | length > 0
    fail_msg: infra_openbao_token must be set for the infra agent; refusing to deploy an agent without secret access credentials.

- name: Ensure infra config directory exists
  file:
    path: /home/prod/.config/infra
    state: directory
    owner: prod
    group: web
    mode: "0700"

- name: Create prod SSH directory
  file:
    path: /home/prod/.ssh
    state: directory
    owner: prod
    group: web
    mode: "0700"

- name: Generate SSH key for prod user
  community.crypto.openssh_keypair:
    path: /home/prod/.ssh/id_ed25519
    type: ed25519
    owner: prod
    group: web
  register: prod_ssh_key

- name: Authorize prod key for self-SSH
  authorized_key:
    user: prod
    key: "{{ prod_ssh_key.public_key }}"
    state: present

- name: Deploy prod SSH config
  template:
    src: ssh-config.j2
    dest: /home/prod/.ssh/config
    owner: prod
    group: web
    mode: "0600"

- name: Show prod public key for GitHub deploy keys
  debug:
    msg: "prod@{{ inventory_hostname }} public key: {{ prod_ssh_key.public_key }}"
  when: prod_ssh_key.changed

- name: Create infra agent directory
  file:
    path: /opt/infra
    state: directory
    owner: prod
    group: web
    mode: "0775"

- name: Ensure infra dir is group-writable for rsync
  command: chmod -R g+w /opt/infra
  changed_when: false

- name: Rsync infra agent bundle
  command: >
    rsync -rlD --delete
    --chmod=Dg+rwx,Fg+rw
    --exclude=node_modules --exclude=.git --exclude=docs --exclude=state.db --exclude=.env --exclude=.config/infra/api-token --exclude=.config/infra/webhook-secret --exclude=.config/infra/openbao-token
    -e 'ssh -p {{ ansible_port | default(22) }} -o StrictHostKeyChecking=accept-new -o UpdateHostKeys=yes'
    {{ playbook_dir }}/tools/infra/
    {{ ansible_user }}@{{ ansible_host }}:/opt/infra/
  delegate_to: localhost
  become: false
  notify: restart infra-agent

- name: Fix infra agent ownership
  file:
    path: /opt/infra
    state: directory
    owner: prod
    group: web
    recurse: true

- name: Install bun dependencies
  command: /home/prod/.bun/bin/bun install --frozen-lockfile
  args:
    chdir: /opt/infra
  become_user: prod
  changed_when: false

- name: Write OpenBao bootstrap token file
  copy:
    content: "{{ infra_openbao_token | trim }}\n"
    dest: /home/prod/.config/infra/openbao-token
    owner: prod
    group: web
    mode: "0600"
  no_log: true
  notify: restart infra-agent

- name: Seed infra agent secrets into OpenBao
  command: >
    /usr/bin/env HOME=/home/prod OPENBAO_ADDR={{ vault_addr | quote }}
    OPENBAO_TOKEN={{ infra_openbao_token | quote }}
    INFRA_API_TOKEN={{ infra_api_token | quote }}
    {% if infra_webhook_secret is defined and (infra_webhook_secret | trim | length > 0) %}INFRA_WEBHOOK_SECRET={{ infra_webhook_secret | quote }} {% endif %}
    {% if infra_allow_insecure_http | default(false) %}INFRA_ALLOW_INSECURE_HTTP=true {% endif %}
    /home/prod/.bun/bin/bun run /opt/infra/src/main.ts vault seed-agent-secrets
  args:
    chdir: /opt/infra
  become_user: prod
  no_log: true
  changed_when: false
  notify: restart infra-agent

- name: Deploy infra agent user unit
  template:
    src: infra-agent.service.j2
    dest: /home/prod/.config/systemd/user/infra-agent.service
    owner: prod
    group: web
    mode: "0644"
  notify: restart infra-agent

- name: Remove old system unit if present
  file:
    path: /etc/systemd/system/infra-agent.service
    state: absent
  notify: reload systemd

- name: Start infra agent user unit
  become_user: prod
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ prod_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ prod_uid.stdout }}/bus"
  systemd:
    name: infra-agent
    scope: user
    state: started
    enabled: true
    daemon_reload: true
