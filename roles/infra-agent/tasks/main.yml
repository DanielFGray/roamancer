---
- name: Create infra agent directory
  file:
    path: /opt/infra
    state: directory
    owner: prod
    group: web
    mode: "0775"

- name: Rsync infra agent bundle
  command: >
    rsync -rlD --delete
    --exclude=node_modules --exclude=.git --exclude=docs
    -e 'ssh -o StrictHostKeyChecking=no'
    {{ playbook_dir }}/tools/infra/
    {{ ansible_user }}@{{ ansible_host }}:/opt/infra/
  delegate_to: localhost
  become: false
  notify: restart infra-agent

- name: Fix infra agent ownership
  file:
    path: /opt/infra
    state: directory
    owner: prod
    group: web
    recurse: true

- name: Install bun dependencies
  command: /home/prod/.bun/bin/bun install --frozen-lockfile
  args:
    chdir: /opt/infra
  become_user: prod
  changed_when: false

- name: Deploy infra agent env file
  template:
    src: infra-agent.env.j2
    dest: /opt/infra/.env
    owner: prod
    group: web
    mode: "0600"
  notify: restart infra-agent

- name: Deploy infra agent systemd unit
  template:
    src: infra-agent.service.j2
    dest: /etc/systemd/system/infra-agent.service
    mode: "0644"
  notify: restart infra-agent

- name: Start infra agent
  systemd:
    name: infra-agent
    state: started
    enabled: true
    daemon_reload: true
