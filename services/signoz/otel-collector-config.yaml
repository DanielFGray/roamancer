receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "https://postgres.garden"
            - "https://otel.dfg.rocks"
            - "https://signoz.dfg.rocks"

processors:
  batch:
    send_batch_size: 10000
    timeout: 1s

exporters:
  clickhousetraces:
    datasource: tcp://clickhouse:9000
  clickhousemetricswrite:
    endpoint: tcp://clickhouse:9000
  clickhouselogsexporter:
    dsn: tcp://clickhouse:9000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousemetricswrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouselogsexporter]
