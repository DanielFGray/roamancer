services:
  signoz:
    image: signoz/signoz:v0.111.0
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/data/signoz:/var/lib/signoz
    environment:
      SIGNOZ_ALERTMANAGER_PROVIDER: signoz
      SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: "tcp://clickhouse:9000"
      SIGNOZ_SQLSTORE_SQLITE_PATH: /var/lib/signoz/signoz.db
      STORAGE: clickhouse
      GODEBUG: "netdns=go"
      DEPLOYMENT_TYPE: docker-standalone-amd
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infra
    # aardvark-dns (Debian bookworm's version) doesn't reliably answer
    # container-to-container queries, so cross-project hostnames are
    # pinned by IP here instead of relying on it -- see roles/compose's
    # "Pin clickhouse's address" task, which is the other half of this.
    extra_hosts:
      - "clickhouse:10.89.3.10"

  otel-collector:
    image: signoz/signoz-otel-collector:v0.142.0
    restart: always
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "host.name=signoz-host,os.type=linux"
      LOW_CARDINAL_EXCEPTION_GROUPING: "false"
    networks:
      - infra
    extra_hosts:
      - "clickhouse:10.89.3.10"

networks:
  infra:
    external: true
