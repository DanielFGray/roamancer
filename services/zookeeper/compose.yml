services:
  zookeeper:
    image: signoz/zookeeper:3.7.1
    restart: always
    ports:
      - "127.0.0.1:2181:2181"
    volumes:
      - /srv/data/zookeeper:/bitnami/zookeeper
    environment:
      ZOO_SERVER_ID: "1"
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_AUTOPURGE_INTERVAL: "1"
    networks:
      - infra

networks:
  infra:
    external: true
