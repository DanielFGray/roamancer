# Permanent redirects that atheist's Caddy served.
[http.routers.www-danielfgray-com]
entryPoints = ["web"]
rule = "Host(`www.danielfgray.com`)"
service = "noop@internal"
middlewares = ["to-danielfgray-com"]

[http.middlewares.to-danielfgray-com.redirectRegex]
regex = "^https?://[^/]+(.*)"
replacement = "https://danielfgray.com${1}"
permanent = true

[http.routers.setlist-dfg-rocks]
entryPoints = ["web"]
rule = "Host(`setlist.dfg.rocks`)"
service = "noop@internal"
middlewares = ["to-giglist"]

[http.middlewares.to-giglist.redirectRegex]
regex = "^https?://[^/]+(.*)"
replacement = "https://giglist.dfg.rocks${1}"
permanent = true

[http.routers.git-danielfgray-com]
entryPoints = ["web"]
rule = "Host(`git.danielfgray.com`)"
service = "noop@internal"
middlewares = ["to-github"]

[http.middlewares.to-github.redirectRegex]
regex = "^https?://[^/]+(.*)"
replacement = "https://github.com/DanielFGray${1}"
permanent = true
