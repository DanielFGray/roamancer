---
# The testground's inventory. The playbook and every role are the ones that
# ship — only the addresses differ, which is the whole point.
#
# 10.13.37.0/24 is NOT available: it is routed over wg0 to the real VPS, and
# cynic.dlab already answers there. A ground on that subnet would talk to
# production. So the nodes keep their production fqdns, which is what the roles
# and the Caddyfile reference, but answer at 10.13.38.x locally.
#
# ansible_host is the literal IP here rather than the name, so the control
# machine reaches the VMs without an /etc/hosts entry of its own — the name
# still lands on every node, because roles/common writes it from dlab_fqdn.
all:
  children:
    web:
      hosts:
        web01:
          ansible_host: 10.13.38.196
          ansible_port: 2022
          caddy_enabled: true
          dlab_fqdn: cynic.dlab
          dlab_ip: 10.13.38.196

    obs:
      hosts:
        obs01:
          ansible_host: 10.13.38.83
          ansible_port: 10022
          dlab_fqdn: atheist.dlab
          dlab_ip: 10.13.38.83

  vars:
    ansible_user: dan
    ansible_python_interpreter: /usr/bin/python3
    obs_addr: "{{ hostvars['obs01']['dlab_ip'] }}"
    web_addr: "{{ hostvars['web01']['dlab_ip'] }}"
    # No public DNS and no Cloudflare here, so OpenBao gets no real certificate.
    vault_tls_disable: true
    vault_addr: "http://{{ obs_addr }}:8200"
    vault_version: "2.5.1"
    vault_checksum: "a7cc2207e6e0a262127e4a0b00f3553526778266be80796c811f4a57677089a2"
    infra_api_port: 9000
